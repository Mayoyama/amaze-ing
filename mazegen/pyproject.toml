[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Standalone 2D maze generator and solver, extracted from the A-Maze-ing project"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["mazegen*"]